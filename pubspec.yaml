name: folio_wallet
description: Premium personal finance companion for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  sqflite: ^2.4.3
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  camera: ^0.12.0+2
  local_auth: ^3.0.2
  file_picker: ^12.0.0
  fl_chart: ^1.2.0
  uuid: ^4.6.0
  csv: ^8.0.0
  excel: ^4.0.6
  google_mlkit_text_recognition: ^0.17.1
  google_fonts: ^6.3.2
  google_sign_in: ^6.3.0
  http: ^1.5.0
  syncfusion_flutter_pdf: ^33.2.13
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
    # Manrope is bundled rather than fetched at runtime.
    # google_fonts picks these up by filename.
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: '#F3F1EB'
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 24

flutter_native_splash:
  color: '#F3F1EB'
  color_dark: '#111214'
  image: assets/branding/app_icon.png
  android_12:
    color: '#F3F1EB'
    color_dark: '#111214'
    image: assets/branding/app_icon.png
  android_min_sdk: 24
